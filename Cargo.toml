[workspace]
members = ["crates/*"]
exclude = ["crates/memstat"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dulrich/crucible-vault"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
