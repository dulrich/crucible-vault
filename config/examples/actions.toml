# Example `actions.toml` (plan v0-core-daemon WP-9). Copy into CV_CONFIG_DIR.
# The daemon reads <vault>/_custom/crucible-vault/ (override: CV_CONFIG_DIR).
#
# An action = id, label, typed steps, starters, resource keys, lane.
#   durable = false  -> `run_action` waits (<=10 s) and returns `open_path`.
#   durable = true   -> `run_action` returns the job id at once (default).
#   lane = "auto" (default: command runs -> user lane, event/schedule runs -> background),
#          "user" or "background".
#   starters default to [{ type = "command" }]; event starters need a non-empty selector (I5).
#   resources: the active/triggering note path (note = true, default) plus `kind::id`
#              templates using {path} and {param.NAME}. An action that mutates a note but
#              derives no key is refused at enqueue.
# Step `type`s: guard, capture, materialize, move, copy, set_props, remove_props, upsert_tags,
# lint, localize, agent, mark_forwarded, run_action, search_upsert, search_delete, link_scan,
# yt_metadata, yt_channel_enrich, x_discover, x_metadata, x_backfill, image_describe,
# track_youtube, track_blogs, track_mail, auto_file, intake_reconcile, ignore_video, daily_brief,
# dupes_scan, dupes_resolve, tidy, intake_enrich.
# Each step's other keys belong to its module (WP-10..13 document them; WP-10's in
# crates/cv/src/steps/{materialize,capture,file,lint}.rs). Step string params take single-brace
# placeholders {param.NAME}, {vars.NAME}, {path}, {period.day|week|month}; note/capture templates
# take Crucible's {{...}} tokens plus {{vars.NAME}}.
# Actions that write a note other than the active one name it in `resources.keys`
# (period notes: "note::period::<day|week|month>").

[[action]]
id = "lint-note"
label = "Lint current note"
group = "Notes"
keys = ["ctrl+alt+l"]
needs = ["active_path"]
durable = false
[[action.steps]]
type = "lint"

[[action]]
id = "tag-note"
label = "Add a tag"
group = "Notes"
needs = ["active_path"]
[[action.params]]
name = "tag"
label = "Tag"
kind = "text"
required = true
[[action.steps]]
type = "upsert_tags"
tags = ["{param.tag}"]

# Event-started: re-lint inbox notes edited outside the daemon (origin defaults to "external").
[[action]]
id = "inbox-lint"
label = "Lint inbox notes on edit"
starters = [
  { type = "event", kinds = ["created", "modified"], selector = { folder = "inbox" } },
]
[[action.steps]]
type = "lint"

# A chain: run another action as a child job (same lane, depth limit 4, no cycles).
[[action]]
id = "tidy"
label = "Tidy current note"
needs = ["active_path"]
[[action.steps]]
type = "run_action"
action = "lint-note"

# Schedule-only (see schedules.toml); search keys need no note.
[[action]]
id = "search-refresh"
label = "Refresh search feed"
starters = []
resources = { note = false, keys = ["search::feed"] }
[[action.steps]]
type = "search_upsert"

# ---- WP-10: periods and notes ---------------------------------------------------------------

# Plan B's "open today/this week/this month": materializes the period note if missing (template
# from captures.toml [periods.*]) and returns it as open_path.
[[action]]
id = "period.open"
label = "Open period note"
group = "Periods"
durable = false
resources = { note = false, keys = ["note::period::{param.period}"] }
[[action.params]]
name = "period"
label = "Period"
kind = "enum"
choices = ["day", "week", "month"]
default = "day"
[[action.params]]
name = "date"
label = "Date (default today)"
kind = "date"
[[action.steps]]
type = "materialize"
period = "{param.period}"
date = "{param.date}"

[[action]]
id = "note.create"
label = "Create note"
group = "Notes"
durable = false
resources = { note = false, keys = ["{param.path}"] }
[[action.params]]
name = "path"
label = "Path"
kind = "path"
required = true
[[action.params]]
name = "template"
label = "Template"
kind = "path"
[[action.steps]]
type = "materialize"
path = "{param.path}"
template = "{param.template}"

# An externally created period note (e.g. synced from another device) is filled from its period
# template — only while it is empty (Crucible's empty-file-only self-guard). Notes in asset
# subfolders are not period notes and stop the run.
[[action]]
id = "period.fill-created"
label = "Fill externally created period notes"
starters = [
  { type = "event", kinds = ["created"], origin = "external", selector = { folder = "daily" } },
]
[[action.steps]]
type = "materialize"
target = "active"
only_if_empty = true

# ---- WP-10: captures (captures.toml presets) ------------------------------------------------

[[action]]
id = "capture.daylog"
label = "Daylog"
group = "Capture"
resources = { note = false, keys = ["note::period::day"] }
[[action.params]]
name = "value"
label = "Entry"
kind = "text"
required = true
[[action.steps]]
type = "capture"
capture = "daylog"

# Forward task: capture the task line into the next daily note, then mark it [>] in place.
[[action]]
id = "capture.forward-task"
label = "Forward task"
group = "Capture"
needs = ["active_path", "line"]
resources = { note = true, keys = ["note::period::day"] }
[[action.steps]]
type = "capture"
capture = "forward-task"
[[action.steps]]
type = "mark_forwarded"

[[action]]
id = "capture.replace-note"
label = "Replace note contents"
group = "Capture"
needs = ["active_path"]
[[action.params]]
name = "value"
label = "New contents"
kind = "multiline"
required = true
[[action.steps]]
type = "capture"
capture = "replace-note"

[[action]]
id = "capture.monthly-observation"
label = "Monthly observation"
group = "Capture"
needs = ["active_path", "selection"]
resources = { note = false, keys = ["note::period::month"] }
[[action.steps]]
type = "capture"
capture = "monthly-observation"

# ---- WP-10: file-as-kind (kinds.toml) ---------------------------------------------------------

# One action for Crucible's ten "Ingest as ..." chains: move to the kind's folder (links
# rewritten), tag the moved note, lint at the new path (transcript cleanup for kinds that ask for
# it). Move runs first so a destination collision fails the job before any write (plan round-5
# WP-3; matches the live action). The resource key is the active note, which is the note moved.
[[action]]
id = "file-as-kind"
hold = true
fast = true
label = "File as kind"
group = "Ingest"
needs = ["active_path"]
[[action.params]]
name = "kind"
label = "Kind"
kind = "enum"
choices = ["transcript", "fanfic", "blog", "3-2-1", "repo", "prompt-kit", "post", "news", "thread", "quote"]
required = true
[[action.steps]]
type = "move"
kind = "{param.kind}"
# A filed fanfic chapter is renamed `<story> - Chapter <n>` (links follow; no-op for other kinds, and
# a collision or undetectable title leaves the name alone; plan round-23 WP-5).
[[action.steps]]
type = "fanfic_title"
match_kind = "fanfic"
kind = "{param.kind}"
path = "{vars.moved_path}"
[[action.steps]]
type = "upsert_tags"
kind = "{param.kind}"
[[action.steps]]
type = "lint"
path = "{vars.moved_path}"
kind = "{param.kind}"
# Enrich the filed note at its moved path (the child follows the move; plan round-16 WP-5).
[[action.steps]]
type = "run_action"
action = "clip-enrich"

# Refine a transcript with an agent (WP-12 runs the `agent` step; agents.toml/providers.toml are
# WP-12's). Crucible's four per-provider chains become one action with a `provider` param whose
# choices are providers.toml `provider:model` routes. The raw note is copied aside first; the
# refined text then replaces the active note's body (frontmatter kept), as Crucible's
# "Replace Note Contents" capture did.
[[action]]
id = "refine-transcript"
label = "Refine transcript"
group = "Ingest"
needs = ["active_path"]
resources = { note = true, keys = ["raw::{path}"] }
[[action.params]]
name = "provider"
label = "Provider"
kind = "enum"
choices = ["local:local-chat-model", "openrouter:@preset/example-model", "openrouter:@preset/example-model", "codex:gpt-5.5"]
default = "local:local-chat-model"
[[action.steps]]
type = "guard"
not_tag = "refined"
[[action.steps]]
type = "copy"
to = "_raw_transcript"
[[action.steps]]
type = "set_props"
props = { raw-transcript = "{vars.copied_link}" }
[[action.steps]]
type = "agent"
agent = "refine-transcript"
model = "{param.provider}"
output_var = "agent_output"
[[action.steps]]
type = "capture"
target = "active"
mode = "replace"
format = "{{vars.agent_output}}"
[[action.steps]]
type = "upsert_tags"
tags = ["refined"]

# ---- plan v0-automation-pipelines (A2): ingestion pipelines -----------------------------------
# Each step is gated by its pipelines.toml section (absent file = off); cadences live in
# schedules.toml. Event selectors take folder / tag / prop only (no exclusion, no globs); a folder
# selector matches every note below it, subfolders included.

# Link records: rescan a clip on create/modify (an unchanged rescan writes nothing).
[[action]]
id = "link-scan"
fast = true
label = "Link scan (note)"
group = "Ingest"
starters = [
  { type = "event", kinds = ["created", "modified"], selector = { folder = "Clippings" } },
  { type = "command" },
]
[[action.steps]]
type = "link_scan"

[[action]]
id = "link-scan-all"
label = "Link scan (whole vault)"
group = "Ingest"
resources = { note = false, keys = ["link-scan::vault"] }
[[action.steps]]
type = "link_scan"
scope = "vault"
exclude = ["_crucible"]

# YouTube metadata: a note carrying `yt-video-id` gains its `_yt_metadata` note. One static key
# serializes find-or-create (per-video keys are not expressible from a prop).
[[action]]
id = "yt-metadata"
label = "YouTube: fetch metadata"
group = "Ingest"
starters = [
  { type = "event", kinds = ["created", "modified"], selector = { prop = { key = "yt-video-id" } } },
  { type = "command" },
]
resources = { note = true, keys = ["yt-video::metadata"] }
[[action.steps]]
type = "yt_metadata"
[[action.steps]]
type = "yt_channel_enrich"   # no-op unless pipelines.toml [youtube] channel_enrich = true

# X: discover clipped posts in the clipper inbox (pipelines.toml [x] inbox), fetch one post's
# metadata, backfill from link records.
[[action]]
id = "x-discover"
label = "X: discover clipped posts"
group = "Ingest"
starters = [
  { type = "event", kinds = ["created", "modified"], origin = "any", selector = { folder = "Clippings" } },
]
resources = { note = true, keys = ["x::metadata"] }
[[action.steps]]
type = "x_discover"
limit = 50

[[action]]
id = "x-metadata"
label = "X: fetch post metadata"
group = "Ingest"
needs = ["active_path"]
resources = { note = true, keys = ["x::metadata"] }
[[action.steps]]
type = "x_metadata"

[[action]]
id = "x-backfill"
label = "X: backfill metadata from link records"
group = "Ingest"
resources = { note = false, keys = ["x::metadata"] }
[[action.steps]]
type = "x_backfill"
limit = 50

# Clip intake, filing first (plan round-16 WP-5): a new clip's only work on detection is dedup +
# filing (`clip-auto-file`); it never waits on localize or describe. Enrichment (`clip-enrich`)
# follows on the note's final path.
[[action]]
id = "clip-images"
label = "Clip: file, then localize + describe images"
group = "Ingest"
starters = [
  { type = "event", kinds = ["created"], origin = "any", selector = { folder = "Clippings" } },
  { type = "event", kinds = ["created"], origin = "any", selector = { tag = "clippings" } },
]
[[action.steps]]
type = "run_action"
action = "clip-auto-file"

# Clip dedup + auto-file (plan auto-intake-sprint WP-5). It has NO event starter on purpose (audit
# E1): it runs only as the child of `clip-images`, with that run's context (active_path = the
# clip). It spawns `clip-enrich` on the final path: the supersede target that took the clip's body,
# or the clip left in place; a clip filed by `file-as-kind` is enriched by that action's last step.
[[action]]
id = "clip-auto-file"
fast = true
label = "Clip: dedup + auto-file by kind"
group = "Ingest"
needs = ["active_path"]
[[action.steps]]
type = "auto_file"

# One-shot reconcile of existing `note` tracker rows (plan auto-intake-sprint WP-6): links NULL-path
# rows to their notes, probes open blog rows and ticks complete ones. Run by `cv intake reconcile
# [--dry-run]` (a job param `dry_run = true` writes nothing). The step holds `intake::identity`.
[[action]]
id = "intake-reconcile"
label = "Reconcile intake rows"
group = "Ingest"
resources = { note = false, keys = ["tracker::reconcile"] }
[[action.steps]]
type = "intake_reconcile"

# Duplicate scan (plan round-12-feedback-todos WP-6): labels candidate pairs (same recomputed
# identity, or shingle containment >= 0.7) in both notes' `possible-duplicate`; never removes.
# Excludes daily x daily, initiatives/, _yt_metadata/, _custom/, _crucible/, .trash/ and the _raw_transcript x daily
# identity pairing; pairs in `not-duplicate-of` are suppressed. Job param `dry_run = true` counts only.
[[action]]
id = "dupes-scan"
label = "Scan for duplicate notes"
group = "Maintenance"
resources = { note = false, keys = ["dupes::scan"] }
[[action.steps]]
type = "dupes_scan"

# Duplicate verdict (plan round-12-feedback-todos WP-7), sent by the Properties panel's
# possible-duplicate buttons: `not-duplicates` moves the pair to both notes' `not-duplicate-of`;
# `keep` re-points tracker rows from `other` to `keep`, then trashes `other`. One dup_labels row each.
[[action]]
id = "dupes-resolve"
label = "Resolve a duplicate pair"
group = "Maintenance"
resources = { note = false, keys = ["{param.keep}", "{param.other}"] }
[[action.params]]
name = "keep"
label = "Keep"
kind = "path"
required = true
[[action.params]]
name = "other"
label = "Other"
kind = "path"
required = true
[[action.params]]
name = "verdict"
label = "Verdict"
kind = "enum"
choices = ["not-duplicates", "keep"]
required = true
[[action.steps]]
type = "dupes_resolve"

# Enrichment of a filed clip (plan round-16 WP-5): localize its images, then describe them, in one
# job on the note's final path. The shared `clip::enrich` key lets at most one enrichment run at a
# time, so the queue's other slot stays free for filing. The last two steps are `yt-metadata`'s own:
# the daemon-written `yt-video-id` (set by `lint` while filing) never fires `yt-metadata`'s
# external-origin starter, so enrichment links the metadata note directly (direct steps, not
# `run_action`: the filed-clip chain is already at the depth limit). Both are no-ops on a note
# without a video id; the channel step is a no-op unless pipelines.toml [youtube] channel_enrich.
[[action]]
id = "clip-enrich"
hold = true
label = "Clip: localize + describe images"
group = "Ingest"
needs = ["active_path"]
resources = { note = true, keys = ["clip::enrich"] }
[[action.steps]]
type = "localize"
[[action.steps]]
type = "image_describe"
scope = "note"
[[action.steps]]
type = "yt_metadata"
[[action.steps]]
type = "yt_clip_tidy"        # YouTube: deletes the thumbnail embed + clipped description above `## Transcript`
[[action.steps]]
type = "yt_channel_enrich"   # no-op unless pipelines.toml [youtube] channel_enrich = true
[[action.steps]]
type = "transcript_refine"   # YouTube `## Transcript` section -> refined text + `###` chapters; skips a refined note
[[action.steps]]
type = "intake_enrich"       # one LLM structure + cleanup pass; skips an already-enriched note (forced after a refine)
[[action.steps]]
type = "search_upsert"       # last: indexes the refined + enriched text

# Intake enrich (plan intake-auto-enrich WP-3, D29): one LLM pass over one note — a collapsed top
# block, chapter headings in heading-less bodies, and one folded `[!removed]-` callout holding what
# the cleanup marked (nothing is deleted). Filed clips get it as a step of `clip-enrich`, after
# `transcript_refine` and before the final search refresh (the chain is already at the depth limit);
# new tracker blog and mail notes get it as a child job enqueued by `track_blogs` / `track_mail`
# once the note is final. Same `clip::enrich` key as `clip-enrich`, so enrich runs serialize on that
# key and slow enrichment never occupies more than one of the 3 general slots (the 1 fast slot is
# separate). `force` re-runs an enriched note. `transcript_refine` runs first (plan
# youtube-transcript-auto-refine, D30): a refined YouTube note is re-enriched forced, so the top
# block and fold are built on the refined text.
[[action]]
id = "intake-enrich"
hold = true
label = "Intake: enrich note"
group = "Ingest"
needs = ["active_path"]
resources = { note = true, keys = ["clip::enrich"] }
[[action.params]]
name = "force"
label = "Force"
kind = "bool"
default = "false"
[[action.steps]]
type = "transcript_refine"
[[action.steps]]
type = "intake_enrich"
[[action.steps]]
type = "search_upsert"

# Manual backfill: enqueues `intake-enrich` for the newest `limit` unenriched intake notes (tracker
# blog/mail notes: `post-id` / `message-id`; clipped YouTube: a youtube `source`). The children
# share the `clip::enrich` key, so they run one at a time. Run it again for the next batch. The
# `limit` param is text (there is no integer param kind); a non-integer or non-positive value fails.
[[action]]
id = "intake-enrich-backfill"
label = "Intake: enrich recent notes"
group = "Ingest"
resources = { note = false, keys = ["intake::enrich-backfill"] }
[[action.params]]
name = "limit"
label = "Notes per run"
kind = "text"
default = "20"
[[action.steps]]
type = "intake_enrich"
scope = "backfill"

# One-shot YouTube clip backfill (plan round-19-yt-cleanup-intake WP-3): over every indexed note whose
# `source` is a YouTube URL (outside `.trash/`, `_yt_metadata/`, `_raw_transcript/`, `_custom/`) it
# deletes the thumbnail embed + clipped description above `## Transcript`, strips the transcript
# timestamps on `post`-tagged notes, and fills a blank `publication` from the linked metadata note
# (`publication`, else `channelTitle`). No network, no child jobs; a partial shape is left alone, so
# a second run changes nothing. Job param `dry_run = true` counts only.
[[action]]
id = "yt-clip-tidy-backfill"
label = "YouTube clips: tidy existing notes"
group = "Ingest"
resources = { note = false, keys = ["yt-clip-tidy::backfill"] }
[[action.params]]
name = "dry_run"
label = "Dry run"
kind = "bool"
default = "false"
[[action.steps]]
type = "yt_clip_tidy"
scope = "backfill"

# Fanfic titles (plan round-23 WP-5): renames existing `fanfic`-tagged notes not already named
# `<story> - Chapter <n>` (title shapes, else a leading `Chapter N` body line); links follow. A taken
# target name or an undetectable shape is left alone and counted. Defaults to a dry run (counts
# only); run with `dry_run = false` to rename. A second run renames nothing.
[[action]]
id = "fanfic-title-backfill"
label = "Fanfic: chapter titles"
group = "Ingest"
resources = { note = false, keys = ["fanfic-title::backfill"] }
[[action.params]]
name = "dry_run"
label = "Dry run"
kind = "bool"
default = "true"
[[action.steps]]
type = "fanfic_title"
scope = "backfill"
kind = "fanfic"

# Removals review (plan round-23 WP-6): enrichment folds removed text, and that text is note content
# an agent must not read, so the user labels it. `removals-review` samples up to `limit` removed
# spans of the enriched notes, stratified by intake type (blog/mail/youtube/clip) and seeded (same
# seed + same corpus = same sample), into one note `_crucible/reviews/removals-<date>.md`: a `- [ ]`
# item per span (note link, type, the span quoted). Tick = the text should NOT have been removed.
# An existing note of the same date is an error unless `overwrite = true` (it may hold ticks).
# `limit`/`seed` are text (no integer param kind); a non-positive or non-integer value fails.
[[action]]
id = "removals-review"
label = "Removals: sample a review note"
group = "Maintenance"
resources = { note = false, keys = ["removals::review"] }
[[action.params]]
name = "limit"
label = "Spans sampled"
kind = "text"
default = "100"
[[action.params]]
name = "seed"
label = "Seed"
kind = "text"
default = "1"
[[action.params]]
name = "overwrite"
label = "Overwrite an existing note"
kind = "bool"
default = "false"
[[action.steps]]
type = "removals_review"
mode = "review"

# Scores a ticked review note: precision = 1 - ticked/items, overall and per type, as job outcome
# vars only (`items`, `ticked`, `precision`, `items_<type>`, `ticked_<type>`, `precision_<type>`).
# Reads the newest `_crucible/reviews/removals-*.md` unless `path` is set. Writes nothing.
[[action]]
id = "removals-score"
label = "Removals: score the review note"
group = "Maintenance"
resources = { note = false, keys = ["removals::review"] }
[[action.params]]
name = "path"
label = "Review note (blank = newest)"
kind = "text"
default = ""
[[action.steps]]
type = "removals_review"
mode = "score"

[[action]]
id = "image-describe-note"
label = "Describe images in note"
group = "Ingest"
needs = ["active_path"]
[[action.steps]]
type = "image_describe"
scope = "note"
[[action.steps]]
type = "search_upsert"

[[action]]
id = "image-describe-backfill"
label = "Backfill image descriptions"
group = "Ingest"
resources = { note = false, keys = ["image-describe::backfill"] }
[[action.steps]]
type = "image_describe"
scope = "vault"

# Trackers (schedules.toml: every 3 h): new items become `# Intake` lines in today's note
# (captures.toml `tracker-intake`); full-body blog posts become captured notes.
[[action]]
id = "track-youtube"
label = "Track YouTube channels"
group = "Ingest"
resources = { note = false, keys = ["tracker::youtube"] }
[[action.steps]]
type = "track_youtube"
limit_per_source = 50

[[action]]
id = "track-blogs"
label = "Track blogs"
group = "Ingest"
resources = { note = false, keys = ["tracker::blogs"] }
[[action.steps]]
type = "track_blogs"

# Maildir newsletter intake (plan auto-intake-sprint WP-4): pipelines.toml [mail] + sources.toml
# [[newsletter]] configure it. The step itself holds the `intake::identity` key.
[[action]]
id = "track-mail"
label = "Track newsletters (Maildir)"
group = "Ingest"
resources = { note = false, keys = ["tracker::mail"] }
[[action.steps]]
type = "track_mail"

# Ignore Shorts: a new metadata note from an [ignore_shorts] channel, at most max_seconds long,
# is ignored. The folder selector cannot exclude `_yt_metadata/_unavailable/` tombstones; they
# carry no duration_seconds, so the step is a no-op success on them.
[[action]]
id = "ignore-shorts"
label = "Ignore Shorts"
group = "Ingest"
starters = [
  { type = "event", kinds = ["created"], selector = { folder = "_yt_metadata" } },
]
[[action.steps]]
type = "ignore_video"

[[action]]
id = "youtube-ignore-video"
label = "YouTube: ignore this video"
group = "Ingest"
needs = ["active_path"]
[[action.steps]]
type = "ignore_video"
mode = "manual"

# Cancels every open intake row of one source (plan cancel-source-intake): enter a source key or
# its name exactly (case-insensitive); an ambiguous name fails and lists the candidates. Database
# only. Sources removed from sources.toml are cancelled automatically by their tracker.
[[action]]
id = "cancel-source-intake"
label = "Cancel open intake from source"
group = "Ingest"
[[action.params]]
name = "source"
label = "Source"
kind = "text"
required = true
[[action.steps]]
type = "cancel_source_intake"
source = "{param.source}"

# Daily Brief (schedules.toml: daily 06:00): FX + weather into today's `# Daily Brief`.
[[action]]
id = "daily-brief"
label = "Daily Brief"
group = "Ingest"
resources = { note = false, keys = ["note::period::day"] }
[[action.steps]]
type = "daily_brief"

# One-time repair + backfill (plan usability-sprint-captures-links WP-2). `cv run` passes no
# params, so each step binds its folder. Counts (localized/failed/unattempted_remaining,
# renamed/retagged/skipped) are logged at info and returned as step vars.
# Localize backfill: up to `limit` notes per run with remote/data images; a note that still has
# them afterwards is recorded (ignored_ids kind `localize_backfill`) and never re-selected.
[[action]]
id = "localize-backfill-clippings"
label = "Localize backfill: Clippings"
group = "Maintenance"
resources = { note = false, keys = ["localize-backfill::Clippings"] }
[[action.steps]]
type = "localize"
scope = "folder"
folder = "Clippings"
limit = 50

[[action]]
id = "localize-backfill-daily"
label = "Localize backfill: daily"
group = "Maintenance"
resources = { note = false, keys = ["localize-backfill::daily"] }
[[action.steps]]
type = "localize"
scope = "folder"
folder = "daily"
limit = 50

# Vault tidiness (plan tidiness-trash-orphans WP-2): trashes orphaned managed attachments older
# than `min_age_hours`, gives every unrecorded `.trash/` file (and cv-owned system-trash entry) a
# ledger row, and deletes entries past `vault.toml` `[trash] retention_days`. Daily at 04:30.
[[action]]
id = "vault-tidy"
label = "Vault tidy: orphaned attachments and trash"
group = "Maintenance"
resources = { note = false, keys = [] }
[[action.steps]]
type = "tidy"
min_age_hours = 24

# Whole-vault localize sweep (plan remote-media-sprint WP-4): every note outside _custom/ and the
# dot-dirs, machine-written _* folders included, up to 500 candidates per run, then a describe
# pass for the images it created. Notes settled once (ignored_ids localize_media_backfill) are
# never re-selected, so edits rely on localize-on-edit. Shares localize-sweep's resource keys so
# the two never run concurrently.
[[action]]
id = "localize-vault-sweep"
label = "Localize sweep: whole vault"
group = "Maintenance"
resources = { note = false, keys = ["localize-backfill::Clippings", "localize-backfill::daily", "localize-backfill::sweep"] }
[[action.steps]]
type = "localize"
scope = "vault"
limit = 500
[[action.steps]]
type = "run_action"
action = "image-describe-backfill"
