# agents.toml — example agents (plan v0-core-daemon WP-12; Crucible `src/agents.ts`).
# One table per agent id. Keys: `name`, `system` | `system_file`, `prompt` | `prompt_file`
# (vault paths, read through the daemon), `input` (rendered into {{value}}/{{input}}),
# `model` ("provider:model" default), `max_tokens` (required, > 0).
# Placeholders: {{content}} (note body, no frontmatter), {{selection}}, {{value}}, {{input}},
# {{title}}, {{vars.NAME}}.
#
# Crucible's 4 "Transcript Refiner" agents (data.json) differed only in their pinned model and
# prompt file; the refine action picks the model with its `provider` param (D3), so the HTTP
# ones collapse into `refine-transcript`. The tables below keep one per original agent so each
# default stays reachable by id.

[refine-transcript]
name = "Transcript Refiner (Local)"
prompt_file = "_custom/prompts/Refine Transcript.md"
input = "{{content}}"
model = "local:local-chat-model"
max_tokens = 16384

[refine-transcript-openrouter]
name = "Transcript Refiner (OpenRouter GPT-6.1-Terra)"
prompt_file = "_custom/prompts/Refine Transcript.md"
input = "{{content}}"
model = "openrouter:openai/gpt-6.1-terra"
max_tokens = 16384

[refine-transcript-openrouter-mimo]
name = "Transcript Refiner (OpenRouter MiMo-V2.6-Pro)"
prompt_file = "_custom/prompts/Refine Transcript.md"
input = "{{content}}"
model = "openrouter:xiaomi/mimo-v2.6-pro"
max_tokens = 16384

# The CLI refiner edited the note in place given its path; here it receives the body like the
# others and returns the refined text (the daemon stays the only writer).
[refine-transcript-cli]
name = "Transcript Refiner (Codex CLI)"
prompt_file = "_custom/prompts/CLI In-Place Refine Transcript.md"
input = "{{content}}"
model = "codex:gpt-5.5"
max_tokens = 16384

# Intake enrich (plan intake-auto-enrich WP-3, D29): ONE call per intake note returns a JSON object
# (summary, entities, key_claims, chapters, spans, content_ends_after) of verbatim anchors that
# the `intake_enrich` step resolves and applies; the model never rewrites the note. GPT-6.1-Terra
# at its default (low) effort; the spike's answers were well under 4k tokens. Repoint `model`
# at another route (e.g. the local llama.cpp provider or MiMo-V2.6-Pro) without code changes.
[intake-enrich]
name = "Intake Enrich"
prompt_file = "_custom/prompts/Intake Enrich.md"
input = "{{content}}"
model = "openrouter:openai/gpt-6.1-terra"
max_tokens = 8192

# Transcript refine (plan youtube-transcript-auto-refine WP-1, D30): the `transcript_refine` step
# sends ONE `## Transcript` section (or a <=12k-word chunk of it) per call as `{{value}}` and
# replaces the section with the refined text plus `###` chapter headings. Same route as
# `intake-enrich`; repoint `model` without code changes. `max_tokens` fits a 12k-word chunk
# (spike: 2.8k-13.3k output tokens per 2.7k-12.8k words).
[transcript-refine]
name = "Transcript Refine"
prompt_file = "_custom/prompts/Refine Transcript Chapters.md"
input = "{{value}}"
model = "openrouter:openai/gpt-6.1-terra"
max_tokens = 32000
