# providers.toml — example provider registry (plan v0-core-daemon WP-4/WP-12).
# Mirrors the shape of Crucible's 3 providers (data.json `providers`) with generic ids and
# placeholder secrets. API keys come from the env var named by `api_key_env`, or a bare file
# name under ~/.config/crucible-vault/ via `api_key_file` — never from the vault (D4).
# The `refine-transcript` action's `provider` enum param lists `provider:model` refs from here.

[[provider]]
id = "local"
kind = "openai-compatible"
name = "Local inference"
base_url = "http://127.0.0.1:8080/v1"
local = true

# Optional `label`: the display name model pickers show (wins over the server's live name).
[[provider.models]]
id = "local-chat-model"
# label = "Local chat model"

[[provider.models]]
id = "local-embed-model"
capabilities = ["embed"]

[[provider.models]]
id = "local-rerank-model"
capabilities = ["rerank"]

[[provider]]
id = "openrouter"
kind = "openai-compatible"
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[[provider.models]]
id = "@preset/example-model"

[[provider.models]]
id = "@preset/example-model"

[[provider.models]]
id = "openai/text-embedding-3-small"
capabilities = ["embed"]

[[provider]]
id = "codex"
kind = "cli"
name = "Codex CLI"
command = "codex"
timeout_seconds = 900

[[provider.models]]
id = "gpt-5.5"

# Local inference router (inference-server) — codex subscription models via the sidecar. The router
# authenticates `x-gateway-key`; the key arrives via the host-env consumer `crucible-vault`
# (EnvironmentFile drop-in, migration 0025). The sidecar serves one request at a time.
[[provider]]
id = "router"
kind = "anthropic"
name = "Inference router"
base_url = "http://127.0.0.1:4813"
api_key_env = "CV_ROUTER_GATEWAY_KEY"
auth_header = "x-gateway-key"
max_concurrent_requests = 1

[[provider.models]]
id = "codex-profile-a/gpt-6.1-terra"
label = "GPT-6.1 Terra (codex)"
