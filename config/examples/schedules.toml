# Example `schedules.toml` (plan v0-core-daemon WP-9). Each entry adds a schedule starter to an
# action from actions.toml: `daily = "HH:MM"` (local time) or `every = "<n>m" | "<n>h"`.
# The last run is kept in state.db; after downtime a missed schedule catches up once.

[[schedule]]
action = "search-refresh"
every = "30m"

# plan v0-automation-pipelines (A2): every pipeline cadence is an entry here.
[[schedule]]
action = "track-youtube"
every = "3h"

[[schedule]]
action = "track-blogs"
every = "3h"

[[schedule]]
action = "track-mail"
every = "15m"

[[schedule]]
action = "daily-brief"
daily = "06:00"
