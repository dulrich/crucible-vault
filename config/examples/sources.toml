# Example `sources.toml` (plan v0-automation-pipelines, D21): the tracked-source registry, which
# replaces Crucible's `Tracked Channels.md` / `Tracked Feeds.md` tables.
#
# [[youtube]]: channel (name), id (UC…), tags, priority (high | normal | low | skip | ignore).
# [[blog]]: name, link (RSS/Atom feed), method (rss; others are skipped), tags, priority,
#   canon (auto | substack | strip-params | keep-params), body (auto | full | snippet),
#   paywall_markers (body phrases marking a post incomplete; default none).
# [[newsletter]] (Maildir intake, plan auto-intake-sprint): name, from (exact address or @domain,
#   case-insensitive), list_id, blog (the name of a [[blog]] row it mirrors; must exist), kind
#   (default blog), tags, paywall_markers (united with the linked blog row's). A row needs a
#   `from`, a `list_id` or `hosts`. Mail from an unmatched sender is still captured (source
#   "unknown-sender"). hosts (web-clip hosts, www. ignored) files a clip from that host as the row's
#   kind with its publication (auto-file step 2b, after the [[blog]]-row host match).
# [[serial]] (plan round-11-feedback-todos, replaces the core/works notes): name (unique), short
#   (publication; default name), author (bare name; [[ ]] and # ignored), prefix (source-URL
#   prefixes), kind (kinds.toml key; required: a row without it is never filed), status (active | complete | ignored; the Works
#   view's, filing ignores it). A clip matches when its author list holds `author` AND some prefix
#   starts its source (a row with neither matches nothing); the first matching row in file order
#   files it as `kind` and gives it the row's publication.
# Every row kind accepts works = true (listed in the Works view; default false).
# skip / ignore rows are kept but excluded from runs.

[[youtube]]
channel = "Example Channel"
id = "UCxxxxxxxxxxxxxxxxxxxxxx"
tags = ["example"]
priority = "normal"

[[blog]]
name = "Example Blog"
link = "https://example.com/feed.xml"
method = "rss"
tags = ["example"]
priority = "normal"
canon = "auto"
body = "auto"

