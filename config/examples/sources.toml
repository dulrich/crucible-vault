# Example `sources.toml` (plan sources-publication-model, D21): the tracked-source registry, one
# [[publication]] per publication, which replaces Crucible's Markdown tables of tracked YouTube
# channels and blogs.
#
# [[publication]] keys:
#   name (unique), short (the `publication` shown in the Author column; default name),
#   kind (kinds.toml key its items file as), author (bare name; [[ ]] and # ignored),
#   status (active | complete | ignored; the Works view's, filing ignores it), tags,
#   priority (high | normal | low | skip | ignore; skip / ignore are excluded from runs),
#   works (listed in the Works view; unset = the kind default),
#   feeds (RSS/Atom feed URLs) with method (rss; others are skipped),
#   canon (auto | substack | strip-params | keep-params), body (auto | full | snippet),
#   paywall_markers (body phrases marking a post or email incomplete),
#   from (mail senders: exact address or @domain, case-insensitive), list_id (List-Id matchers),
#   hosts (web-clip hosts, www. ignored), prefix (source-URL prefixes: when any is set a clip
#   matches by prefix alone, otherwise by author), channel_id (YouTube UC… id).
# A record needs at least one of feeds, from, list_id, hosts, prefix, channel_id or author, and
# no sender, list id, feed, host, prefix or channel id may belong to two records. Mail from an
# unmatched sender is still captured (source "unknown-sender").
# Legacy [[youtube]] / [[blog]] / [[newsletter]] / [[serial]] tables still load (folded into
# records by publication name); `cv sources migrate` rewrites them as [[publication]].

[[publication]]
name = "Example Channel"
tags = ["example"]
priority = "normal"
channel_id = "UCxxxxxxxxxxxxxxxxxxxxxx"

[[publication]]
name = "Example Blog"
tags = ["example"]
priority = "normal"
feeds = ["https://example.com/feed.xml"]
method = "rss"
canon = "auto"
body = "auto"

# A newsletter that mirrors the blog joins its record:
# from = ["writer@news.example"]      # or "@news.example"
# list_id = ["letter.news.example"]
# kind = "blog"
# paywall_markers = ["Upgrade to read the rest"]

