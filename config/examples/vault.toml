# Example `vault.toml` (plan tidiness-trash-orphans WP-1). Copy into CV_CONFIG_DIR
# (live: <vault>/_custom/crucible-vault/). An absent file or key means the default shown.

[trash]
location = "vault"              # "vault" = <vault>/.trash/<path>; "system" = the desktop (XDG) trash,
                                # $XDG_DATA_HOME/Trash (default ~/.local/share/Trash); a cross-device
                                # system move falls back to the vault .trash/ with a warning
retention_days = 30             # trashed files are deleted permanently after N days; 0 = never

# Remote content (plan remote-media-sprint): how remote images, video, audio and PDFs are handled.
# Every `localize` step reads these as its defaults; an explicit step param overrides them.
[remote_media]
images = "localize"             # remote images are downloaded into the vault
video = "thumbnail"             # "thumbnail" = linked local thumbnail card; "link" = plain link
audio = "link"                  # "link" keeps a link; "localize" downloads the file
pdf = "link"                    # "link" keeps a link; "localize" downloads the file
convert_images = false          # re-encode downloaded images, keeping the result when smaller
image_format = "webp"           # "webp" | "jpeg"
timeout_secs = 30               # per download
max_bytes = 52428800            # per download (50 MiB)

# Vault structure (plan public-release WP-2): the machinery folders the daemon's steps read.
# Every key is optional; absent = the default shown.
[structure]
app_folder = "_crucible"        # the app's own folder (review notes land in <app_folder>/reviews)
# exclude = [".trash", "_custom", "_crucible", "_yt_metadata", "_x_metadata"]
                                # folders dupes_scan and link_scan skip (a link_scan step's own
                                # `exclude` wins); unset = .trash, _custom, the app folder and the
                                # pipelines.toml [youtube]/[x] metadata_root folders
raw_transcript_folder = "_raw_transcript"  # where transcript_refine keeps the original note
