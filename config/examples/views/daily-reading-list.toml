# Example: reading list for a day note. Copy into `<config>/views/` (see README.md).
# `this` = the day note; rows are the reading entries in `daily/day/<day>/`.
# `formula.access` (example): 🔒 = user action needed (the note is a teaser, `complete: false`,
# or paid/founding without `complete: true`); it clears when the full body lands (`complete: true`).

[filters]
and = ['file.folder == folder("day") + "/" + this.file.name']

[formulas]
tags = 'list(note.tags).map(value.toString().replace("#", "")).filter(value != "clippings").join(", ")'
minutes = '(number(note["word-count"]) / number(file("_custom/Settings.md").properties.reading_wpm)).round(1)'
read = 'if(note.read == true, "✅", "❌")'
access = 'if(note.complete == false || ((note.access == "paid" || note.access == "founding") && note.complete != true), "🔒", "")'

[[views]]
type = "table"
name = "Reading List"
order = ["file.name", "formula.access", "note.publication", "formula.tags", "word-count", "formula.minutes", "note.read"]
summaries = { "word-count" = "Sum", "formula.minutes" = "Sum" }
columnSize = { "note.read" = 137, "word-count" = 80, "formula.minutes" = 80 }
maxHeight = "none"

[[views.summary_rows]]
label = "Unread"
filter = 'note.read != true'
summaries = { "word-count" = "Sum", "formula.minutes" = "Sum" }

[properties."note.read"]
displayName = "Read"
checkbox = true

[properties."note.publication"]
displayName = "Author"

[properties."formula.access"]
displayName = "Access"
