[package]
name = "cv-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Exact `=x.y.z` pins, all declared up front at WP-1 of `plans/v0-core-daemon.md` so later
# WPs never edit manifests or Cargo.lock. A bump is a deliberate change of its own.
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
toml = "=1.1.8"
# `From<wire>` for the cv-ingest metadata types.
cv-ingest = { path = "../cv-ingest" }
# `days_from_civil` shared with `cv jobs` (plan tn-review-2026-10-29-remediation WP-R2).
cv-text = { path = "../cv-text" }

[dev-dependencies]
# The shared std-only `MockHttp`.
cv-testkit = { path = "../cv-testkit" }

[lints]
workspace = true
