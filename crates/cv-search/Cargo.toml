[package]
name = "cv-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Exact `=x.y.z` pins, all declared up front at WP-1 of `plans/v0-core-daemon.md` so later
# WPs never edit manifests or Cargo.lock. A bump is a deliberate change of its own.
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
regex = "=1.13.1"
cv-providers = { path = "../cv-providers" }
cv-state = { path = "../cv-state" }
# The in-process search index (plan semsearch-crate; D22), a path dep like `ofm` in cv-index.
semsearch = { path = "../../../semsearch/crates/semsearch" }

[lints]
workspace = true
