[package]
name = "editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cvault-editor"
path = "src/main.rs"

[dependencies]
# Exact `=x.y.z` pins, all declared up front at WP-1 of `plans/v0-editor.md` so later plan-B
# WPs never edit manifests or Cargo.lock. A bump is a deliberate change of its own.
# iced features: `image-without-codecs` (image widget + `Handle::from_rgba`; codecs come from the
# `image` pin below, matching `crates/cv`), `tokio` (executor), `advanced` (custom widgets: the
# virtual list, the highlighter-driven editor). No `markdown` (plan "Dependency posture"), no
# `highlighter` (syntect; WP-2 implements iced's `Highlighter` trait itself).
# Plan memory-instrumentation-and-reduction WP-M5: the renderer is a build flag (`gpu`/`cpu` below), so
# iced's `default-features` are off; the other iced defaults are kept explicitly: `crisp`,
# `web-colors`, `thread-pool`, `linux-theme-detection`, `x11`, `wayland`.
iced = { version = "=0.14.0", default-features = false, features = ["image-without-codecs", "tokio", "advanced", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
anyhow = "=1.0.104"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
tracing = "=0.1.44"
# Plan memory-instrumentation-and-reduction WP-M1: the arena cap moved to `cv-malloc` (all glibc FFI).
cv-malloc = { path = "../cv-malloc" }
# Plan memory-instrumentation-and-reduction WP-M2: the editor's gauge registry (vendored).
memstat = { path = "../memstat" }
# Plan editor-feedback-round-2 WP-9: image paste sends bytes to the `write_attachment` RPC.
base64 = "=0.22.1"
# Plan round-15-relative-images-pdf-viewer WP-3: the PDF tab renders pages with hayro (pure Rust;
# only `src/pdf.rs` imports it). Default features (embedded fonts/cmaps, simd).
hayro = "=0.8.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
cv-protocol = { path = "../cv-protocol" }
cv-index = { path = "../cv-index" }
cv-state = { path = "../cv-state" }
cv-text = { path = "../cv-text" }
cv-vault = { path = "../cv-vault" }
# Only the `fake` feature (`--fake <dir>`)
# seeds a synthetic vault; the release binary carries neither it nor `FakeDaemon`.
cv-testkit = { path = "../cv-testkit", optional = true }
editor-model = { path = "../editor-model" }
# Plan editor-settings-tab WP-2: config schemas + comment-preserving `ConfigDoc` (pure crate).
cv-schema = { path = "../cv-schema" }
# Plan editor-settings-tab WP-3 (Views carve-out): the views crate's own parse + compile for
# local view-file diagnostics.
views = { path = "../views" }
ofm = { path = "../../../crucible-tui/crates/ofm" }
# Plan round-5 WP-7: word bounds / grapheme steps of the Reading selection (already locked).
unicode-segmentation = "=1.13.3"

[features]
# Renderer (plan memory-instrumentation-and-reduction WP-M5). `gpu` (default): wgpu with tiny-skia as
# iced's runtime fallback. `cpu`: tiny-skia only, no wgpu compiled
# (`--no-default-features --features cpu`).
default = ["gpu"]
gpu = ["iced/wgpu", "iced/tiny-skia"]
cpu = ["iced/tiny-skia"]
# `cvault-editor --fake <dir>`: the in-process `FakeDaemon` over a synthetic vault (dev only).
fake = ["dep:cv-testkit"]

[dev-dependencies]
tempfile = "=3.27.0"
cv-testkit = { path = "../cv-testkit" }

[lints]
workspace = true
