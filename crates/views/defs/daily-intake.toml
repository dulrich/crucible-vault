# Daily intake (plan round-5-reading-pickers-intake WP-11): the tracker items recorded for the
# embedding day note when `pipelines.toml` `[intake] mode = "view"` replaces the daily intake lines.
# `this` = the day note. Rows come from state.db `tracker_items`; `note` outcomes link to the
# captured note, `line` outcomes to the item URL. The `status` column is the editor's task-status checkbox (state.db v8; plan round-6-feedback-todos).
# Type = the kind label (YouTube / Blog / raw kind). Source = the source's display name
# (`sources.toml` at record time, self-healed for older rows), blank when unknown. Length = the
# YouTube duration (`h:mm:ss` / `m:ss`), else a blog body's reading minutes from its word count and
# `Settings.md` `reading_wpm`, else blank. Plans intake-view-source-length, intake-type-column-length-backfill.
source = "tracker_items"

[filters]
and = ['day == this.file.name', 'outcome == "line" || outcome == "note"']

[formulas]
item = 'if(outcome == "note" && note_path, link(note_path, title), url(url, title))'
type = 'if(source_kind == "youtube", "YouTube", if(source_kind == "blog", "Blog", source_kind))'
source = 'if(source_name, source_name, "")'
mins = '(duration % 3600 - duration % 60) / 60'
secs = 'if(duration % 60 < 10, "0", "") + duration % 60'
wpm = 'number(file("_custom/Settings.md").properties.reading_wpm)'
length = 'if(duration, if(duration >= 3600, (duration - duration % 3600) / 3600 + ":" + if(formula.mins < 10, "0", "") + formula.mins + ":" + formula.secs, (duration - duration % 60) / 60 + ":" + formula.secs), if(word_count && formula.wpm > 0, (word_count / formula.wpm).round() + " min", ""))'

[properties."formula.item"]
displayName = "Title"

[properties."formula.type"]
displayName = "Type"

[properties."formula.source"]
displayName = "Source"

[properties."formula.length"]
displayName = "Length"

[properties.status]
displayName = "Done"

[[views]]
type = "table"
name = "Intake"
order = ["formula.item", "formula.type", "formula.source", "formula.length", "status"]
