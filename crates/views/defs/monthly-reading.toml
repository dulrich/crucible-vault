# Migrated from vault-repo `_custom/bases/monthly-reading.base` (`Unread`, `By Tag`), expressions verbatim,
# plus `By Day` restored from the deleted Dataview `monthly-note-reading-by-tag.js`.
# `this` = the month note (`this.file.name` = `YYYY-MM`).

[formulas]
tags = 'list(note.tags).map(value.toString().replace("#", "")).filter(value != "clippings" && value != "refined" && value != "using").join(", ")'
minutes = '(number(note["word-count"]) / number(file("_custom/Settings.md").properties.reading_wpm)).round(1)'
category = 'if(list(note.tags).map(value.toString().replace("#", "")).contains("blog"), "blog", if(list(note.tags).map(value.toString().replace("#", "")).contains("news"), "news", if(list(note.tags).map(value.toString().replace("#", "")).contains("transcript"), "transcript", if(list(note.tags).map(value.toString().replace("#", "")).contains("fanfic"), "fanfic", "other"))))'

[filters]
and = [
  'file.inFolder("daily/day")',
  'file.path.startsWith("daily/day/" + this.file.name)',
]

[[views]]
type = "table"
name = "Unread"
filters = { and = ['note.read == false'] }
order = ["file.name", "formula.tags", "note.word-count", "formula.minutes", "note.created"]
sort = [{ property = "note.created", direction = "ASC" }]
summaries = { "note.word-count" = "Sum", "formula.minutes" = "Sum" }

[[views]]
type = "table"
name = "By Tag"
filters = { and = ['!list(note.tags).map(value.toString().replace("#", "")).contains("daily")', 'note.created'] }
groupBy = { property = "formula.category", direction = "ASC" }
order = ["file.name", "note.created", "note.word-count", "formula.minutes"]
sort = [{ property = "note.created", direction = "ASC" }]
summaries = { "note.word-count" = "Sum", "formula.minutes" = "Sum" }

# Restored: words per day x category for the host month. Category = first match in the script's
# priority order (blog, news, transcript, fanfic; else other); notes tagged `daily` are excluded;
# Total row + column; Average/day = total / days with entries. Cells are "words / minutes" at
# `reading_wpm` from `_custom/Settings.md` (the script's default 250 when missing).
[[views]]
type = "pivot"
name = "By Day"
filters = { and = ['!list(note.tags).map(value.toString().replace("#", "")).contains("daily")', 'note.created'] }
rows = 'note.created.format("YYYY-MM-DD")'
rows_label = "Day"
rows_direction = "ASC"
columns = [
  { label = "Blog", when = 'list(note.tags).map(value.toString().replace("#", "")).contains("blog")' },
  { label = "News", when = 'list(note.tags).map(value.toString().replace("#", "")).contains("news")' },
  { label = "Transcript", when = 'list(note.tags).map(value.toString().replace("#", "")).contains("transcript")' },
  { label = "Fanfic", when = 'list(note.tags).map(value.toString().replace("#", "")).contains("fanfic")' },
  { label = "Other" },
]
value = 'number(note["word-count"])'
aggregate = "sum"
display = 'if(value > 0, value.round(0).toString() + " / " + (value / number(if(file("_custom/Settings.md").properties.reading_wpm, file("_custom/Settings.md").properties.reading_wpm, 250))).toFixed(1) + "m", "—")'
total_column = "Total"
total_row = "Total"
average_row = "Average/day"
