# Works over `sources.toml` (plan round-11-feedback-todos Decision 5; replaces the per-work
# notes, migrated by deploy migration 0007; plan sources-publication-model WP-5).
# - Which records are listed: a publication is "In Works" when its own `works` says so, else when
#   its kind's `[kinds.<kind>] works` in `kinds.toml` does, else not (a record with no kind and no
#   `works` is not listed). Only In-Works records appear below and only they set `file.serial`;
#   each is listed once.
# - Active/Complete read `source = "sources"`: one row per In-Works record (`ignored` records are
#   in neither view). The daemon computes each row's fields: `name`, `publication`, `author`
#   (bare), `prefix`, `kind`, `status`, `row` (serial for a record with a prefix or an author,
#   else blog|newsletter|youtube) and the per-row counts over `daily/day` notes — `entries`,
#   `unread` (`read != true`) and `last_update` (latest `created ?? file.ctime`). Work records
#   count notes matched by the shared matcher (`Publication::matches_note`: a record with a prefix
#   matches by prefix alone, else by author; one with neither matches nothing); other records
#   count notes whose `publication` equals the record's. Zero renders `·` (the
#   `entries`/`unread` formulas below).
# - Unread stays an index view of unread `daily/day` notes; `file.serial` is the name of the first
#   In-Works work record (config order) the note matches by that same matcher (null when none, or
#   when the only match has In Works off), supplied by the daemon — never restated as an
#   expression here.
# - Entries `select_by = "file.serial"` (plan round-13 WP-4): clicking a work row's Name in
#   Active/Complete on the same note filters Entries to that work; clicking it again clears.

[formulas]
tags = 'list(note.tags).map(value.toString().replace("#", "")).filter(value != "clippings" && value != "using").join(", ")'
minutes = '(number(note["word-count"]) / number(file("_custom/Settings.md").properties.reading_wpm)).round(1)'
read = 'if(note.read == true, "✅", "❌")'
created = 'if(note.created, note.created, file.ctime)'
entries = 'if(note.entries > 0, note.entries, "·")'
unread = 'if(note.unread > 0, note.unread, "·")'

[properties."note.name"]
displayName = "Name"

[properties."note.status"]
displayName = "Status"

[properties."note.author"]
displayName = "Author"

[properties."note.prefix"]
displayName = "Prefix"

[properties."note.kind"]
displayName = "Kind"

[properties."formula.entries"]
displayName = "Entries"

[properties."formula.unread"]
displayName = "Unread"

[properties."note.last_update"]
displayName = "Last Update"

[[views]]
type = "table"
name = "Active"
source = "sources"
filters = 'note.status == "active"'
order = ["note.name", "note.status", "note.author", "note.kind", "formula.entries", "formula.unread", "note.last_update"]
sort = [{ property = "note.name", direction = "ASC" }]

[[views]]
type = "table"
name = "Complete"
source = "sources"
filters = 'note.status == "complete"'
order = ["note.name", "note.status", "note.author", "note.kind", "formula.entries", "formula.unread", "note.last_update"]
sort = [{ property = "note.name", direction = "ASC" }]

[[views]]
type = "table"
name = "Unread"
filters = { and = [
  'file.inFolder(folder("day"))',
  'note.read != true',
  'file.serial',
] }
order = ["file.name", "formula.tags", "note.word-count", "formula.minutes", "formula.created"]
sort = [{ property = "formula.created", direction = "ASC" }]
summaries = { "note.word-count" = "Sum", "formula.minutes" = "Sum" }

[[views]]
type = "table"
name = "Entries"
filters = { and = [
  'file.inFolder(folder("day"))',
  'file.serial',
] }
order = ["file.name", "formula.tags", "note.word-count", "formula.read", "formula.created"]
sort = [{ property = "formula.created", direction = "ASC" }]
groupBy = { property = "file.serial", direction = "ASC" }
select_by = "file.serial"
