# Works over `sources.toml` (plan round-11-feedback-todos Decision 5; replaces the per-work
# notes, migrated by deploy migration 0007).
# - Active/Complete read `source = "sources"`: every `[[serial]]` row plus every `[[blog]]`,
#   `[[newsletter]]` and `[[youtube]]` row with `works = true` (`ignored` serial rows are in
#   neither view). The daemon computes each row's fields: `name`, `publication`, `author` (bare),
#   `prefix`, `kind`, `status`, `row` (serial|blog|newsletter|youtube) and the per-row counts over
#   `daily/day` notes — `entries`, `unread` (`read != true`) and `last_update` (latest
#   `created ?? file.ctime`). Serial rows count notes matched by the shared serial matcher
#   (`cv_actions::pipelines::SerialSource::matches`: a row with a prefix matches by prefix alone,
#   else by author; a row with neither matches nothing); other rows count notes whose
#   `publication` equals the row's. Zero renders `·` (the `entries`/`unread` formulas below).
# - Unread stays an index view of unread `daily/day` notes; `file.serial` is the name of the first
#   `[[serial]]` row (config order) the note matches by that same matcher (null when none),
#   supplied by the daemon — never restated as an expression here.
# - Entries `select_by = "file.serial"` (plan round-13 WP-4): clicking a `[[serial]]` row's Name in
#   Active/Complete on the same note filters Entries to that work; clicking it again clears.

[formulas]
tags = 'list(note.tags).map(value.toString().replace("#", "")).filter(value != "clippings" && value != "using").join(", ")'
minutes = '(number(note["word-count"]) / number(file("_custom/Settings.md").properties.reading_wpm)).round(1)'
read = 'if(note.read == true, "✅", "❌")'
created = 'if(note.created, note.created, file.ctime)'
entries = 'if(note.entries > 0, note.entries, "·")'
unread = 'if(note.unread > 0, note.unread, "·")'

[properties."note.name"]
displayName = "Name"

[properties."note.status"]
displayName = "Status"

[properties."note.author"]
displayName = "Author"

[properties."note.prefix"]
displayName = "Prefix"

[properties."note.kind"]
displayName = "Kind"

[properties."formula.entries"]
displayName = "Entries"

[properties."formula.unread"]
displayName = "Unread"

[properties."note.last_update"]
displayName = "Last Update"

[[views]]
type = "table"
name = "Active"
source = "sources"
filters = 'note.status == "active"'
order = ["note.name", "note.status", "note.author", "note.kind", "formula.entries", "formula.unread", "note.last_update"]
sort = [{ property = "note.name", direction = "ASC" }]

[[views]]
type = "table"
name = "Complete"
source = "sources"
filters = 'note.status == "complete"'
order = ["note.name", "note.status", "note.author", "note.kind", "formula.entries", "formula.unread", "note.last_update"]
sort = [{ property = "note.name", direction = "ASC" }]

[[views]]
type = "table"
name = "Unread"
filters = { and = [
  'file.inFolder(folder("day"))',
  'note.read != true',
  'file.serial',
] }
order = ["file.name", "formula.tags", "note.word-count", "formula.minutes", "formula.created"]
sort = [{ property = "formula.created", direction = "ASC" }]
summaries = { "note.word-count" = "Sum", "formula.minutes" = "Sum" }

[[views]]
type = "table"
name = "Entries"
filters = { and = [
  'file.inFolder(folder("day"))',
  'file.serial',
] }
order = ["file.name", "formula.tags", "note.word-count", "formula.read", "formula.created"]
sort = [{ property = "formula.created", direction = "ASC" }]
groupBy = { property = "file.serial", direction = "ASC" }
select_by = "file.serial"
