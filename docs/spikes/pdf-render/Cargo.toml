[workspace]

[package]
name = "pdf-render-spike"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "base"
path = "src/base.rs"
[[bin]]
name = "r_hayro"
path = "src/r_hayro.rs"
[[bin]]
name = "r_pdfium"
path = "src/r_pdfium.rs"

[dependencies]
hayro = "0.8.0"
pdfium-render = "0.9.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
